name: Deploy staging site

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' && vars.DEV_SITE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development source
        uses: actions/checkout@v4

      - name: Build staging site
        run: bash scripts/build-static-site.sh . _site

      - name: Publish to staging Pages repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEV_SITE_DEPLOY_TOKEN }}
          external_repository: GavinScheu/Auburn-iRacing-dev
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true